<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votkinsk and Saint Petersburg – Russia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; width: 100%; background: #d9dde0; }
  .name-label {
    font-size: 15px; font-weight: 600; color: #1d2a33;
    border: 1px solid #1d2a33; border-radius: 4px; padding: 3px 8px;
  }
  #status {
    position: absolute; z-index: 1000; bottom: 24px; left: 10px; display: none;
    background: #fff; padding: 6px 10px; border-radius: 4px; font-size: 13px;
    box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Could not load the Russia border; showing the full map area instead.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const RUSSIA_URL = 'https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries/RUS.geo.json';

  const map = L.map('map', { minZoom: 2, zoomSnap: 0.25 });
  // Keyless tile layers (no API key, work when the page is opened as a local file)
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'
  }).addTo(map);

  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    subdomains: 'abc', maxZoom: 17,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
  });

  // Official OSM tiles only work if the page is served over http(s), not opened from a file
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  });

  L.control.layers({ 'Streets (Esri)': esri, 'Topographic': topo, 'OpenStreetMap (needs http server)': osm }).addTo(map);

  // Start on a rough Russia view; refined once the border loads
  map.fitBounds([[41, 19], [82, 190]]);

  // Markers with "Cyrillic (Latin)" names on top
  const cities = [
    { label: 'Воткинск (Votkinsk)', pos: [57.0519, 53.9873] },
    { label: 'Санкт-Петербург (Saint Petersburg)', pos: [59.9343, 30.3351] }
  ];
  cities.forEach(c => {
    L.circleMarker(c.pos, {
      radius: 7, color: '#fff', weight: 2, fillColor: '#d62828', fillOpacity: 1
    }).addTo(map)
      .bindTooltip(c.label, {
        permanent: true, direction: 'top', offset: [0, -8], className: 'name-label'
      });
  });

  // Dim everything outside Russia so only Russia is shown
  fetch(RUSSIA_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      const geom = data.features ? data.features[0].geometry : data.geometry;
      const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

      // Chukotka crosses the 180° line: move western-hemisphere points east so Russia is one piece
      const rings = polys.map(p => p[0].map(([x, y]) => [y, x < 0 ? x + 360 : x]));

      const world = [[-90, -360], [-90, 720], [90, 720], [90, -360]];
      L.polygon([world, ...rings], {
        stroke: false, fillColor: '#2b3640', fillOpacity: 0.88, interactive: false
      }).addTo(map);

      const outline = L.polygon(rings, {
        color: '#d62828', weight: 1.5, fill: false, interactive: false
      }).addTo(map);

      const b = outline.getBounds();
      map.fitBounds(b);
      map.setMaxBounds(b.pad(0.3));
    })
    .catch(() => { document.getElementById('status').style.display = 'block'; });
</script>
</body>
</html>
